<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <filter id="pillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(30px, -20px); opacity: 0.6; }
    }
    @keyframes pulseCyan {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.15) translate(-25px, 25px); opacity: 0.55; }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes pulseRing {
      0% { r: 6; opacity: 0.9; }
      50% { r: 16; opacity: 0.2; }
      100% { r: 6; opacity: 0.9; }
    }

    .bg-orb1 { transform-origin: 250px 180px; animation: pulseOrb 8s ease-in-out infinite; }
    .bg-orb2 { transform-origin: 950px 220px; animation: pulseCyan 10s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 12, 12; animation: dashStream 14s linear infinite; }
    .pill-group-1 { animation: floatPill1 6s ease-in-out infinite; }
    .pill-group-2 { animation: floatPill2 7s ease-in-out infinite; }
    .node-pulse { animation: pulseRing 3s ease-in-out infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Ambient Orbs (Kept behind foreground) -->
  <circle cx="220" cy="160" r="180" fill="url(#glowGrad)" filter="url(#blurFilter)" class="bg-orb1" />
  <circle cx="980" cy="240" r="200" fill="url(#cyanGlow)" filter="url(#blurFilter)" class="bg-orb2" />

  <!-- Dynamic Connecting Network Streams -->
  <g opacity="0.45">
    <path d="M 50 80 Q 300 20 600 80 T 1150 80" fill="none" stroke="#6366f1" stroke-width="2" class="stream-line" />
    <path d="M 50 350 Q 350 400 650 340 T 1150 360" fill="none" stroke="#06b6d4" stroke-width="1.8" class="stream-line" style="animation-direction: reverse;" />
  </g>

  <!-- Floating Feature Badges / Capability Nodes -->
  <g class="pill-group-1" transform="translate(0, 0)">
    <!-- Pill 1: Skill Synthesis -->
    <g transform="translate(110, 60)">
      <rect width="180" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#38bdf8" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e0f2fe">Skill Extraction</text>
    </g>
    <!-- Pill 2: MCP Protocol -->
    <g transform="translate(910, 60)">
      <rect width="180" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#a855f7" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#a855f7" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f3e8ff">MCP Gateways</text>
    </g>
  </g>

  <g class="pill-group-2" transform="translate(0, 0)">
    <!-- Pill 3: Observability -->
    <g transform="translate(130, 335)">
      <rect width="190" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#34d399" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#34d399" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#d1fae5">Agent Observability</text>
    </g>
    <!-- Pill 4: Resource Routing -->
    <g transform="translate(890, 335)">
      <rect width="195" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#f472b6" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#f472b6" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#fce7f3">Resource Orchestration</text>
    </g>
  </g>

  <!-- Central Foreground Content (Unobscured, crisp, high-contrast) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 130)">
    <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#1e1b4b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="-145" cy="0" r="4" fill="#a5b4fc" />
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#c7d2fe" text-anchor="middle" letter-spacing="1.5">CURATED ECOSYSTEM DIRECTORY</text>
    <circle cx="145" cy="0" r="4" fill="#a5b4fc" />
  </g>

  <!-- Main Title -->
  <text x="600" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1">
    AI Agent Capabilities &amp; Orchestration
  </text>

  <!-- Subtitle -->
  <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="url(#subGrad)">
    Skill Synthesis • Model Context Protocol (MCP) • AI Gateways • Evals • Distributed Telemetry
  </text>

  <!-- Bottom Interactive Accent Bar -->
  <g transform="translate(480, 268)">
    <line x1="0" y1="0" x2="240" y2="0" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <line x1="70" y1="0" x2="170" y2="0" stroke="url(#titleGrad)" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
